    <rect x="227" y="222" width="58" height="74" rx="5" stroke-width="14"/>
    <rect x="322" y="222" width="58" height="74" rx="5" stroke-width="14"/>

    <rect x="132" y="322" width="58" height="42" rx="5" stroke-width="14"/>
    <rect x="227" y="322" width="58" height="42" rx="5" stroke-width="14"/>
    <rect x="322" y="322" width="58" height="42" rx="5" stroke-width="14"/>
  </g>

