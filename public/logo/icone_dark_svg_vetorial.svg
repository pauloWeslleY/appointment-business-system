<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 460 430"><defs>
 <linearGradient id="calendar" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#6720CC"/><stop offset="0.68" stop-color="#3E0794"/><stop offset="1" stop-color="#200A58"/></linearGradient>
 <linearGradient id="check" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#25E8B6"/><stop offset="1" stop-color="#05BF97"/></linearGradient>
