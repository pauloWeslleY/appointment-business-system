<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Appointly Booking System — Dark</title>
  <desc id="desc">Logotipo vetorial roxo para uso em fundos escuros.</desc>

  <g fill="none" stroke="#a855f7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calendar -->
    <rect x="356" y="270" width="312" height="300" rx="12" stroke-width="18"/>
    <rect x="388" y="306" width="248" height="60" rx="4" stroke-width="14"/>

    <!-- Calendar grid -->
    <rect x="390" y="402" width="58" height="76" rx="4" stroke-width="14"/>
    <rect x="483" y="402" width="58" height="76" rx="4" stroke-width="14"/>
    <rect x="576" y="402" width="58" height="76" rx="4" stroke-width="14"/>

    <rect x="390" y="500" width="58" height="42" rx="4" stroke-width="14"/>
    <rect x="483" y="500" width="58" height="42" rx="4" stroke-width="14"/>
    <rect x="576" y="500" width="58" height="42" rx="4" stroke-width="14"/>

    <!-- Pencil -->
    <g transform="rotate(-45 560 360)">
      <rect x="542" y="250" width="36" height="205" rx="18" fill="#a855f7" stroke="#a855f7" stroke-width="8"/>
      <path d="M542 445 L560 486 L578 445 Z" fill="#a855f7" stroke="#a855f7" stroke-width="8"/>
      <line x1="542" y1="286" x2="578" y2="286" stroke="#111827" stroke-width="6"/>
    </g>

    <!-- Divider -->
    <line x1="284" y1="596" x2="740" y2="596" stroke-width="10"/>
  </g>

  <!-- Wordmark -->
  <text x="512" y="670"
        fill="#a855f7"
        font-family="Arial, Helvetica, sans-serif"
        font-size="78"
        font-weight="800"
        letter-spacing="2"
        text-anchor="middle">
    APPOINTLY
  </text>

  <text x="512" y="720"
        fill="#a855f7"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="700"
        letter-spacing="12"
        text-anchor="middle">
    BOOKING SYSTEM
  </text>
</svg>
